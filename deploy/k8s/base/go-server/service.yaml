# ClusterIP Service: a stable virtual IP + DNS name ("go-server") in front of
# whichever go-server pods are Ready right now. Same name as in Compose.
apiVersion: v1
kind: Service
metadata:
  name: go-server
  labels:
    app.kubernetes.io/name: go-server
    bench/target: go
spec:
  selector:
    app.kubernetes.io/name: go-server
  ports:
    - name: http
      port: 8080
      targetPort: http       # the named containerPort, so the pod port can change freely
