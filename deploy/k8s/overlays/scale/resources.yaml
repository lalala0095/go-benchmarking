# Still Guaranteed (requests == limits). 1 CPU -> PY_WORKERS=1 per pod, so
# Python scales by pods (py-1w x N), Go by pods with GOMAXPROCS=1 each.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-server
spec:
  template:
    spec:
      containers:
        - name: go-server
          resources:
            requests: { cpu: "1", memory: 512Mi }
            limits: { cpu: "1", memory: 512Mi }
---
