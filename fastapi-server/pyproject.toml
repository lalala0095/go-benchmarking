[project]
name = "fastapi-server"
version = "0.1.0"
description = "FastAPI + Google ADK server for the Go vs FastAPI ADK benchmark"
requires-python = "==3.12.*"
dependencies = [
    "asyncpg==0.32.0",
    "fastapi==0.141.1",
    "google-adk[db]==2.11.0",
    "httptools==0.9.0",
    "orjson==3.13.0",
    "pgvector==0.5.1",
    "prometheus-client==0.26.0",
    "psutil==7.2.2",
    "tzdata==2026.5",
    "uvicorn==0.54.0",
    "uvloop==0.23.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning"]
